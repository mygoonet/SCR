name: Deploy

on:
  push:
    branches:
      - master

jobs:
  deploy:
    name: Build and deploy on VPS
    runs-on: ubuntu-latest
    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          port: ${{ secrets.VPS_PORT }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            set -e
            cd ~/SCR
            git pull --ff-only
            # Останавливаем контейнер до сборки, чтобы сборка не конкурировала за ресурсы.
            docker compose stop scr
            docker compose build
            docker compose up -d
            docker image prune -f
